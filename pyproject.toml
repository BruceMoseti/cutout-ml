[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutoutml"
version = "0.1.0"
description = "GPU-accelerated image and video segmentation / background-removal platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CutoutML contributors" }]
keywords = ["segmentation", "matting", "background-removal", "onnx", "tensorrt", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pillow>=10.2",
  "opencv-python-headless>=4.9",
  "scipy>=1.12",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "psutil>=5.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "celery>=5.3",
  "redis>=5.0",
  "boto3>=1.34",
  "pyjwt>=2.8",
  # bcrypt is used directly: passlib 1.7.x reads `bcrypt.__about__`, which was
  # removed in bcrypt 4.1+, so the compatibility shim is more trouble than the
  # ~20 lines of hashing code it would save.
  "bcrypt>=4.1",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  # Pulled in explicitly rather than via fastapi[all]: pydantic's EmailStr needs it
  # and the failure mode without it is an import error at first request, not at boot.
  "email-validator>=2.1",
]
onnx = ["onnx>=1.16", "onnxruntime>=1.17"]
# TensorRT is intentionally NOT declared here: the wheels are platform/CUDA specific
# and the adapter degrades gracefully when the import fails. See docs/models.md.
trt = ["tensorrt", "pycuda"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-pyyaml",
  "types-psutil",
  "tabulate>=0.9",
]

[project.scripts]
cutoutml = "cutoutml.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cutoutml = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "services", "tests", "benchmarks"]
extend-exclude = [".venv", "infra/alembic/versions", "artifacts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  # Blind `except Exception` is sometimes exactly right (diagnostics, best-effort
  # cleanup, a metrics call that must not break a request) and usually wrong. Enabling
  # the rule forces each instance to be justified with a noqa comment saying which.
  "BLE",  # flake8-blind-except
  "PTH",  # use pathlib
  "ARG",  # unused arguments
  "N",    # pep8-naming
  "TID",  # tidy imports
  "RUF",
]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "N812",    # `import torch.nn.functional as F`
  "RUF012",  # ClassVar annotations not required for our small registries
]

[tool.ruff.lint.per-file-ignores]
# N803: test doubles for boto3 must mirror its PascalCase keyword arguments.
"tests/**" = ["ARG001", "ARG002", "N802", "N803"]
"benchmarks/*.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["cutoutml"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src", "services", "benchmarks", "tests"]
exclude = "(^\\.venv/|^infra/alembic/versions/|^artifacts/)"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
show_error_codes = true
plugins = []

# Third-party packages that ship no type information. Listing them explicitly, rather
# than setting a global ignore_missing_imports, keeps a genuinely missing first-party
# import an error.
[[tool.mypy.overrides]]
module = [
  "onnx.*", "onnxruntime.*", "prometheus_client.*", "scipy.*",
  "boto3.*", "botocore.*", "tabulate.*",
  # celery and kombu ship no py.typed marker.
  "celery.*", "kombu.*",
  # TensorRT and its CUDA bindings cannot be installed on a machine without a GPU, so
  # these are unresolvable anywhere this project is developed or tested. The adapter is
  # written to degrade when the import fails; see docs/decisions/ADR-005-onnx-runtime.md.
  "tensorrt.*", "pycuda.*", "cuda.*", "cuda.bindings.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# opencv-python's bundled stubs type every array parameter as a union of integer and
# floating dtypes and every return as that same union. A correctly-dtyped call to
# grabCut therefore matches no overload, and `dst = cv2.GaussianBlur(src_f32, ...)`
# is reported as narrowing float32 to a union. Silencing it call-by-call would mean a
# dozen `type: ignore`s that describe the stubs rather than the code, so cv2 is treated
# as untyped instead. Array shapes and dtypes are asserted in tests/test_imaging.py.
module = ["cv2", "cv2.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# Matching this pattern is why tests/__init__.py exists; see the note there.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs live Postgres/Redis/ffmpeg",
  "slow: takes more than a few seconds",
  "onnx: needs onnxruntime",
]
filterwarnings = [
  "ignore::DeprecationWarning:celery.*",
]

[tool.coverage.run]
source = ["src/cutoutml", "services"]
omit = ["*/tensorrt_adapter.py"]
